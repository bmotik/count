<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Count">
<meta name="theme-color" content="#0f1319">
<title>Swipe Count — stacked parts</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230f1319'/%3E%3Cg stroke='%234ce39a' stroke-width='11' stroke-linecap='round'%3E%3Cpath d='M46 44v92M75 44v92M105 44v92M134 44v92'/%3E%3C/g%3E%3C/svg%3E">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0f1319; --panel:#181d26; --panel2:#212834; --line:#2c3441;
    --ink:#eaeef4; --dim:#93a0b1; --accent:#4ce39a; --accent-ink:#062b1c;
    --warn:#ffb454; --bad:#ff6b6b;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  /* An element's own display rule beats the default [hidden] styling, so the
     busy overlay stayed on screen forever. Make hidden win everywhere. */
  [hidden]{display:none!important}
  body{background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    display:flex;flex-direction:column;touch-action:none;
    -webkit-user-select:none;user-select:none}

  header{flex:0 0 auto;padding:calc(var(--safe-t) + 10px) 12px 10px;
    display:flex;align-items:center;gap:12px;background:var(--panel);
    border-bottom:1px solid var(--line)}
  .count{font:700 36px/1 -apple-system,system-ui,sans-serif;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;min-width:2.4ch}
  .count small{display:block;font:500 10px/1.2 system-ui;letter-spacing:.08em;
    text-transform:uppercase;color:var(--dim);margin-top:5px;white-space:nowrap}
  header .grow{flex:1}
  .sens{display:flex;align-items:center;gap:0;background:var(--panel2);
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .sens button{background:none;border:0;color:var(--ink);font:600 19px/1 system-ui;
    width:36px;height:40px}
  .sens button:active{background:#2f3846}
  .sens span{font:600 12px/1 "SF Mono",ui-monospace,monospace;color:var(--dim);
    min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
  .iconbtn{flex:0 0 auto;width:42px;height:42px;border-radius:11px;
    border:1px solid var(--line);background:var(--panel2);color:var(--ink);
    display:grid;place-items:center}
  .iconbtn:active{background:#2f3846}
  .iconbtn[disabled]{opacity:.35}
  svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round;display:block}

  #secBar{flex:0 0 auto;background:var(--panel);color:var(--dim);
    font:500 11.5px/1 "SF Mono",ui-monospace,monospace;padding:0 12px 9px;
    border-bottom:1px solid var(--line);white-space:nowrap;overflow-x:auto}

  #stage{flex:1 1 auto;position:relative;overflow:hidden;background:#070a0e;touch-action:none}
  #wrap{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  #view{display:block}
  .empty{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:30px;
    text-align:center;color:var(--dim)}
  .empty h1{font:600 19px/1.3 system-ui;color:var(--ink)}
  .empty p{max-width:30ch;font-size:14px}
  .empty p.build{font:500 11.5px/1 "SF Mono",ui-monospace,monospace;
    color:#5a6675;letter-spacing:.03em;margin-top:6px}
  .primary{background:var(--accent);color:var(--accent-ink);border:none;
    border-radius:13px;font:600 16px/1 system-ui;padding:15px 24px;
    display:inline-flex;align-items:center;gap:9px}
  .primary:active{filter:brightness(.9)}
  .primary[disabled]{opacity:.4}
  .ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:12px;font:500 14px/1 system-ui;padding:13px 16px}
  .ghost:active{background:#2f3846}
  .ghost.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

  #busy{position:absolute;inset:0;display:grid;place-items:center;z-index:20;
    background:rgba(7,10,14,.82);color:var(--dim);font:500 14px/1 system-ui}

  #cam{position:absolute;inset:0;z-index:25;background:#000;display:flex;
    flex-direction:column;align-items:center;justify-content:center}
  #camView{width:100%;height:100%;object-fit:contain;background:#000}
  .camBar{position:absolute;left:0;right:0;bottom:0;padding:16px 18px 26px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:linear-gradient(transparent,rgba(0,0,0,.75))}
  #camShoot{width:66px;height:66px;border-radius:50%;border:4px solid #fff;
    background:var(--accent);flex:0 0 auto}
  #camShoot:active{filter:brightness(.85)}
  #camShoot[disabled]{opacity:.4}
  .camNote{font:500 11.5px/1.3 system-ui;color:#cfd6df;max-width:9rem;text-align:right}

  #srcTog{display:flex;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;overflow:hidden;margin-right:2px}
  #srcTog button{background:none;border:0;color:var(--dim);
    font:600 11.5px/1 system-ui;padding:9px 10px;white-space:nowrap}
  #srcTog button.on{background:var(--accent);color:var(--accent-ink)}

  .hint{flex:0 0 auto;background:var(--panel);color:var(--dim);
    font-size:11.5px;text-align:center;padding:9px 14px;line-height:1.4}
  .hint.warn{background:#33260f;color:var(--warn);font-weight:500}

  #tools{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);
    display:flex;align-items:center;gap:7px;padding:9px 12px 0;overflow-x:auto}
  #tools .lab{font:600 12.5px/1 system-ui;color:var(--dim);white-space:nowrap;
    margin-right:4px}
  #tools .lab b{color:var(--ink);font-weight:600}
  #tools .lab.good{color:#4ce39a}
  #tools .lab.bad{color:#ffb454}
  #tools button{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);border-radius:9px;font:600 12.5px/1 system-ui;padding:9px 11px}
  #tools button:active{background:#2f3846}
  #tools button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

  footer{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);
    padding:10px 12px calc(var(--safe-b) + 10px);display:flex;gap:8px;align-items:center}
  footer .grow{flex:1}

  #sheet{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:30;
    display:none;align-items:flex-end}
  #sheet.on{display:flex}
  .sheetBody{width:100%;max-height:88%;overflow:auto;background:var(--panel);
    border-radius:18px 18px 0 0;border-top:1px solid var(--line);
    padding:20px 18px calc(var(--safe-b) + 20px);-webkit-user-select:text;user-select:text}
  .sheetBody h2{font:600 17px/1.3 system-ui;margin-bottom:4px}
  .sheetBody .sub{font-size:13px;color:var(--dim);margin-bottom:16px}
  label{display:block;font:600 11px/1 system-ui;letter-spacing:.07em;
    text-transform:uppercase;color:var(--dim);margin:18px 0 8px}
  input[type=number]{width:100%;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;color:var(--ink);font:15px/1 system-ui;padding:12px;
    -webkit-user-select:text;user-select:text}
  .note{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.5}
  .row{display:flex;gap:8px;margin-top:22px}
  .row button{flex:1}
  .row2{display:flex;gap:8px}
  .row2 button{flex:1}
  .kv{display:flex;justify-content:space-between;font-size:13.5px;color:var(--dim);
    padding:9px 0;border-bottom:1px solid var(--line)}
  .kv b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .err{color:var(--bad);font-size:13px;white-space:pre-wrap;
    -webkit-user-select:text;user-select:text}
</style>
</head>
<body>

<header>
  <div class="count"><span id="total">—</span><small id="totalLab">count</small></div>
  <div class="grow"></div>
  <div class="sens">
    <button id="sensDown" aria-label="Less sensitive">&minus;</button>
    <span id="sensVal">1</span>
    <button id="sensUp" aria-label="More sensitive">+</button>
  </div>
  <button class="iconbtn" id="cfgBtn" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.6v3M12 18.4v3M21.4 12h-3M5.6 12h-3M18.6 5.4l-2.1 2.1M7.5 16.5l-2.1 2.1M18.6 18.6l-2.1-2.1M7.5 7.5L5.4 5.4"/></svg></button>
</header>

<div id="secBar" hidden></div>

<div id="stage">
  <div id="wrap"><canvas id="view"></canvas></div>
  <div class="empty" id="empty">
    <h1>Swipe across the stack</h1>
    <p>Photograph the edge, drag one finger across the parts, and every part it finds gets a tick you can correct.</p>
    <button class="primary" id="shootEmpty"><svg viewBox="0 0 24 24" style="width:19px;height:19px"><path d="M3 8.4h3.4L8 5.6h8l1.6 2.8H21v10.2H3z"/><circle cx="12" cy="13.2" r="3.6"/></svg>Take photo</button>
    <button class="ghost" id="pickEmpty">Choose from library</button>
    <button class="ghost" id="torchEmpty">Torch pair (experiment)</button>
    <p class="build" id="buildTag"></p>
  </div>
  <div id="busy" hidden>Working…</div>

  <div id="cam" hidden>
    <video id="camView" playsinline muted autoplay></video>
    <div class="camBar">
      <button class="ghost" id="camCancel">Cancel</button>
      <button id="camShoot" aria-label="Take the pair"></button>
      <span class="camNote" id="camNote">Hold as still as you can</span>
    </div>
  </div>
</div>

<div id="tools" hidden>
  <span id="srcTog" hidden><button id="srcPhoto">Photo</button><button id="srcDiff">Torch</button></span>
  <span class="lab" id="cliffLab"></span>
</div>

<div class="hint" id="hint">Take a photo of the stack edge to begin</div>

<footer>
  <button class="iconbtn" id="shoot" aria-label="New photo"><svg viewBox="0 0 24 24"><path d="M3 8.4h3.4L8 5.6h8l1.6 2.8H21v10.2H3z"/><circle cx="12" cy="13.2" r="3.6"/></svg></button>
  <button class="iconbtn" id="pick" aria-label="Library"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.2"/><circle cx="8.4" cy="10" r="1.6"/><path d="M4 16.6l4.6-4.2 3.4 3 3-2.4L20 17"/></svg></button>
  <button class="iconbtn" id="torchBtn" aria-label="Torch pair"><svg viewBox="0 0 24 24"><path d="M13 2.6L5.4 13.4h5.2l-.6 8 7.6-10.8h-5.2z"/></svg></button>
  <button class="primary grow" id="addSection" disabled>Save section</button>
  <button class="iconbtn" id="clearAll" aria-label="Clear all"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg></button>
  <button class="iconbtn" id="saveBtn" aria-label="Save image"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.6 10.8L12 15.2l4.4-4.4M4.4 19.4h15.2"/></svg></button>
</footer>

<div id="sheet"><div class="sheetBody" id="sheetBody"></div></div>

<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileLib" accept="image/*" hidden>

<script>
/* ===========================================================================
   Stack counting engine — JavaScript port of the Python that was validated
   against Bruno's four workshop photos (A 30/30, B 14/14, C 14/14, D 25/26).

   Nothing here is a fresh idea. Every step exists because a specific thing
   went wrong on a real photo:

     downscale to WORK_W  — full resolution resolves the saw striations on cut
                            faces, which are a strong regular pattern in their
                            own right. One close-up counted 97 parts where
                            there were 8.
     local contrast norm  — a glare gradient otherwise hides parts at the dark
                            end while noise invents them at the bright end.
     harmonic pitch (HPS) — each part shows 2-3 bright lines (face, bevel,
                            shadow). Counting lines gave 30, 25 and 35 where
                            the true answers were 14, 14 and 26.
     low-value padding    — a part sitting exactly at the end of the line is
                            invisible to peak detection: a systematic -1.

   Deliberately absent: automatic scan-line placement (it locks onto tool
   marks) and perspective rectification (on fanned parts the varying spacing
   is real, not distortion).
   =========================================================================== */

const SS = 2;          // profile samples per pixel
const WORK_W = 2200;   // working width in pixels — see note in README

/* ---------------------------------------------------------------- helpers */

function gaussianKernel(sigma) {
  const r = Math.max(1, Math.ceil(4 * sigma));     // scipy truncate=4.0
  const k = new Float64Array(2 * r + 1);
  let sum = 0;
  for (let i = -r; i <= r; i++) {
    const v = Math.exp(-0.5 * (i / sigma) * (i / sigma));
    k[i + r] = v; sum += v;
  }
  for (let i = 0; i < k.length; i++) k[i] /= sum;
  return { k, r };
}

/** 1-D Gaussian filter with reflect padding, matching scipy's default mode. */
function gaussian1d(x, sigma) {
  if (sigma <= 0) return Float64Array.from(x);
  const { k, r } = gaussianKernel(sigma);
  const n = x.length;
  const out = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    let acc = 0;
    for (let j = -r; j <= r; j++) {
      let idx = i + j;
      // reflect: scipy 'reflect' is (d c b a | a b c d | d c b a)
      while (idx < 0 || idx >= n) {
        if (idx < 0) idx = -idx - 1;
        if (idx >= n) idx = 2 * n - idx - 1;
      }
      acc += x[idx] * k[j + r];
    }
    out[i] = acc;
  }
  return out;
}

function percentile(arr, p) {
  const a = Float64Array.from(arr).sort();
  const i = (a.length - 1) * p / 100;
  const lo = Math.floor(i), hi = Math.ceil(i);
  return lo === hi ? a[lo] : a[lo] + (a[hi] - a[lo]) * (i - lo);
}

function mean(a) { let s = 0; for (let i = 0; i < a.length; i++) s += a[i]; return s / a.length; }
function std(a) {
  const m = mean(a); let s = 0;
  for (let i = 0; i < a.length; i++) { const d = a[i] - m; s += d * d; }
  return Math.sqrt(s / a.length);
}

/* -------------------------------------------------------------------- FFT */

/** In-place iterative radix-2 Cooley-Tukey. re/im are Float64Array of length n
    (a power of two). */
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {          // bit-reversal permutation
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) {
      let t = re[i]; re[i] = re[j]; re[j] = t;
      t = im[i]; im[i] = im[j]; im[j] = t;
    }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len;
    const wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const ur = re[i + k], ui = im[i + k];
        const vr = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci;
        const vi = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
        re[i + k] = ur + vr; im[i + k] = ui + vi;
        re[i + k + len / 2] = ur - vr; im[i + k + len / 2] = ui - vi;
        const ncr = cr * wr - ci * wi;
        ci = cr * wi + ci * wr; cr = ncr;
      }
    }
  }
}

/** Power spectrum of a real signal zero-padded to `nfft`. Returns the
    non-negative-frequency half, matching numpy's rfft. */
function realPower(x, nfft) {
  let N = 1; while (N < nfft) N <<= 1;
  const re = new Float64Array(N), im = new Float64Array(N);
  for (let i = 0; i < x.length && i < N; i++) re[i] = x[i];
  fft(re, im);
  const m = (N >> 1) + 1;
  const P = new Float64Array(m);
  for (let i = 0; i < m; i++) P[i] = re[i] * re[i] + im[i] * im[i];
  return { P, N };
}

/* ------------------------------------------------------------ part pitch */

/**
 * Spacing of ONE part, in pixels, via harmonic product spectrum.
 *
 * A part rarely shows a single bright line, so the plain spectrum peaks at a
 * half or a third of the real spacing. HPS multiplies the spectrum by
 * decimated copies of itself: a true fundamental lines up with all its own
 * harmonics and reinforces, while a harmonic mistaken for the fundamental has
 * nothing at half its frequency and collapses. Audio pitch detection uses the
 * same trick against the identical "octave error".
 */
function fundamentalPitch(d, nHarm = 5, loPx = 6, hiPx = 400) {
  const n = d.length;
  const m = mean(d);
  const w = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const han = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (n - 1));
    w[i] = (d[i] - m) * han;
  }
  const target = n * 4;
  const { P, N } = realPower(w, target);
  const prod = Float64Array.from(P);
  for (let h = 2; h <= nHarm; h++) {
    const dec = new Float64Array(P.length);
    for (let i = 0, j = 0; i < P.length; i += h, j++) dec[j] = P[i];
    for (let i = 0; i < prod.length; i++) prod[i] *= Math.pow(dec[i] + 1e-12, 1 / h);
  }
  const klo = Math.max(1, Math.floor(N / (hiPx * SS)));
  const khi = Math.min(prod.length - 1, Math.floor(N / (loPx * SS)));
  if (khi <= klo) return null;
  let best = klo, bv = -Infinity;
  for (let k = klo; k < khi; k++) if (prod[k] > bv) { bv = prod[k]; best = k; }
  return N / best / SS;
}

/* ------------------------------------------------------------ peak finding */

/** Local maxima, taking the midpoint of any plateau (matches scipy). */
function localMaxima(y) {
  const out = [];
  let i = 1;
  const n = y.length;
  while (i < n - 1) {
    if (y[i - 1] < y[i]) {
      let j = i;
      while (j < n - 1 && y[j + 1] === y[i]) j++;
      if (j < n - 1 && y[j + 1] < y[i]) out.push((i + j) >> 1);
      i = j + 1;
    } else i++;
  }
  return out;
}

/** Topographic prominence, as scipy computes it. */
function prominences(y, peaks) {
  const out = new Float64Array(peaks.length);
  for (let p = 0; p < peaks.length; p++) {
    const i = peaks[p], h = y[i];
    let lmin = h, j = i;
    while (j >= 0 && y[j] <= h) { if (y[j] < lmin) lmin = y[j]; j--; }
    let rmin = h; j = i;
    while (j < y.length && y[j] <= h) { if (y[j] < rmin) rmin = y[j]; j++; }
    out[p] = h - Math.max(lmin, rmin);
  }
  return out;
}

/** Keep the tallest peak in any `distance` window, as scipy does. */
function selectByDistance(peaks, heights, distance) {
  const order = peaks.map((_, i) => i).sort((a, b) => heights[b] - heights[a]);
  const keep = new Uint8Array(peaks.length).fill(1);
  for (const i of order) {
    if (!keep[i]) continue;
    for (let j = i - 1; j >= 0 && peaks[i] - peaks[j] < distance; j--) keep[j] = 0;
    for (let j = i + 1; j < peaks.length && peaks[j] - peaks[i] < distance; j++) keep[j] = 0;
  }
  return peaks.filter((_, i) => keep[i]);
}

function findPeaks(y, minProminence, distance) {
  let peaks = localMaxima(y);
  if (!peaks.length) return [];
  const pr = prominences(y, peaks);
  peaks = peaks.filter((_, i) => pr[i] >= minProminence);
  if (!peaks.length) return [];
  if (distance > 1) peaks = selectByDistance(peaks, peaks.map(i => y[i]), distance);
  return peaks;
}

/* ------------------------------------------------------------- sampling */

/** Average intensity along p0->p1, widened `band` pixels sideways.
    Averaging across the band is what kills surface speckle. */
function sampleProfile(gray, W, H, p0, p1, band = 25) {
  const vx = p1.x - p0.x, vy = p1.y - p0.y;
  const L = Math.hypot(vx, vy);
  const n = Math.max(8, Math.floor(L * SS));
  const ux = vx / L, uy = vy / L;
  const px = -uy, py = ux;
  const half = band >> 1;
  const out = new Float64Array(n);
  const at = (x, y) => {                              // bilinear, edge-clamped
    x = Math.min(W - 1, Math.max(0, x));
    y = Math.min(H - 1, Math.max(0, y));
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const x1 = Math.min(W - 1, x0 + 1), y1 = Math.min(H - 1, y0 + 1);
    const fx = x - x0, fy = y - y0;
    const a = gray[y0 * W + x0], b = gray[y0 * W + x1];
    const c = gray[y1 * W + x0], e = gray[y1 * W + x1];
    return a * (1 - fx) * (1 - fy) + b * fx * (1 - fy) + c * (1 - fx) * fy + e * fx * fy;
  };
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const bx = p0.x + t * vx, by = p0.y + t * vy;
    let acc = 0;
    for (let o = -half; o <= half; o++) acc += at(bx + o * px, by + o * py);
    out[i] = acc / (2 * half + 1);
  }
  return { prof: out, L, n };
}

/** Subtract the slow lighting gradient. That is the whole preprocessing step.
 *
 *  Build 6 also divided by the local contrast, so that one threshold would
 *  mean the same thing at the bright and the dark end of a stack. That step
 *  is gone, and its removal is the point of build 7. Dividing by local
 *  contrast amplifies a flat stretch of surface up to the same height as a
 *  real gap: measured on a photo of four fingers, the three gaps had depths
 *  142, 124 and 106 while the deepest thing that was not a gap was 8 — a 13x
 *  cliff. After the division those same six numbers read 3.79, 3.78, 3.64,
 *  3.62, 3.48, 3.39. A wrinkle weighed exactly as much as a gap, and the one
 *  unambiguous signal in the picture had been erased before anything looked
 *  at it.
 */
function flatten(raw) {
  const s = gaussian1d(raw, 1.4);
  const bg = gaussian1d(s, Math.max(12, raw.length / 8));
  const d = new Float64Array(s.length);
  for (let i = 0; i < s.length; i++) d[i] = s[i] - bg[i];
  return d;
}

/** Kept so a saved section counted under build 6 still loads. Not used. */
function detrend(raw) {
  const s = gaussian1d(raw, 1.4);
  const bg = gaussian1d(s, 45);
  const d = new Float64Array(s.length);
  for (let i = 0; i < s.length; i++) d[i] = s[i] - bg[i];
  const sq = new Float64Array(d.length);
  for (let i = 0; i < d.length; i++) sq[i] = d[i] * d[i];
  const env = gaussian1d(sq, 45);
  const out = new Float64Array(d.length);
  const rough = new Float64Array(d.length);
  for (let i = 0; i < d.length; i++) rough[i] = Math.sqrt(env[i]);
  const floor = percentile(rough, 25) * 0.5 + 1e-6;
  for (let i = 0; i < d.length; i++) out[i] = d[i] / Math.max(rough[i], floor);
  return out;
}

/** Every dip in the profile, with its depth, deepest first.
 *
 *  Depth here is topographic prominence: how far you must climb out of a dip
 *  before you can reach anywhere lower. It is the right measure because it
 *  ignores the absolute brightness either side — a shallow notch between two
 *  tall parts scores low even if it is very dark, and a deep separation scores
 *  high even in a dim corner of the photo. */
function valleyDepths(d) {
  const neg = new Float64Array(d.length);
  for (let i = 0; i < d.length; i++) neg[i] = -d[i];
  const idx = localMaxima(neg);
  if (!idx.length) return { pos: [], depth: [] };
  const pr = prominences(neg, idx);
  const order = idx.map((_, i) => i).sort((a, b) => pr[b] - pr[a]);
  return { pos: order.map(i => idx[i]), depth: order.map(i => pr[i]) };
}

/** Where do the depths stop being separations between parts?
 *
 *  Sorted deepest first, real separations sit together at the top and surface
 *  detail sits together at the bottom, with a step between them. Take the
 *  biggest proportional step. There is no tuned threshold here: on the finger
 *  photo the cut can be placed anywhere from 10 to 100 and returns 4. */
function cutAtCliff(depth, maxK = 200, floorFrac = 0.12) {
  const k = Math.min(depth.length - 1, maxK);
  if (k < 2) return { cut: depth.length, ratio: 1 };
  // Stop looking once the dips are a small fraction of the deepest one. Without
  // this the search runs down to the noise floor and finds an enormous step
  // there: on one steel photo it returned 86 parts with a confident-looking
  // 11x, because the step it found was between two pieces of surface texture.
  const limit = floorFrac * depth[0];
  let best = 1, bestR = -1;
  for (let i = 1; i <= k; i++) {
    if (depth[i - 1] < limit) break;
    const r = depth[i - 1] / Math.max(depth[i], 1e-9);
    if (r > bestR) { bestR = r; best = i; }
  }
  return { cut: best, ratio: bestR < 0 ? 1 : bestR };
}

/* ---------------------------------------------------------------- count */

/**
 * Count parts crossed by the segment p0->p1.
 * `gray` is a Float32/Float64Array of luminance, W*H, already at working size.
 */
function countAlongLine(gray, W, H, p0, p1, opts = {}) {
  const band = opts.band ?? 25;
  const sens = opts.sens ?? 1.0;
  const { prof, L, n } = sampleProfile(gray, W, H, p0, p1, band);
  const d = flatten(prof);

  // ---- build 7: count the separations, not the parts ---------------------
  //
  // A part can show two or three bright features - its face, its bevel, a
  // glint - and every one of them reads as a peak. What it cannot show is two
  // separations from its neighbour. So count the gaps and add one. The swipe
  // must start on the first part and end on the last: that is what makes the
  // arithmetic work, and it is the one thing asked of the person holding the
  // phone.
  const { pos, depth } = valleyDepths(d);
  if (pos.length < 2) {
    return { count: 1, positions: [0.5], valleys: [], cliffRatio: 1,
             pitchPx: L, measuredPx: L, lengthPx: L, samples: n };
  }
  const { cut, ratio } = cutAtCliff(depth);
  // The cliff sets the threshold; the -/+ control slides it from there.
  const hi = depth[cut - 1], lo = (cut < depth.length ? depth[cut] : 0);
  const thresh = Math.sqrt(Math.max(hi, 1e-9) * Math.max(lo, hi * 0.02)) / sens;

  const keep = [];
  for (let i = 0; i < pos.length; i++) if (depth[i] >= thresh) keep.push(pos[i]);
  keep.sort((a, b) => a - b);

  // A tick goes in the middle of each part, i.e. between consecutive
  // separations, with the two ends of the swipe closing off the outer parts.
  const bounds = [0, ...keep, n - 1];
  const centres = [];
  for (let i = 0; i < bounds.length - 1; i++) centres.push((bounds[i] + bounds[i + 1]) / 2);
  const pitchPx = L / Math.max(1, centres.length);

  // Did the swipe run past the parts onto the bench? Then the edge of the whole
  // pile is itself a dip, far deeper than any gap between two parts, and it
  // sets the scale everything else is judged against. Detectable: the deepest
  // dip sits in the outer tenth of the swipe AND dwarfs the next few.
  let ranOff = false;
  if (depth.length > 4) {
    const nearEnd = pos[0] < n * 0.10 || pos[0] > n * 0.90;
    const next = (depth[1] + depth[2] + depth[3]) / 3;
    ranOff = nearEnd && depth[0] > next * 2.5;
  }

  return {
    count: centres.length,
    positions: centres.map(i => i / (n - 1)),
    valleys: keep.map(i => i / (n - 1)),
    cliffRatio: ratio,          // how clean the separation was; > 4 is confident
    ranOff,
    pitchPx, measuredPx: pitchPx, lengthPx: L, samples: n
  };
}

/** Build 6's peak counter, kept only so the old behaviour can be compared. */
function countPeaksLegacy(gray, W, H, p0, p1, opts = {}) {
  const band = opts.band ?? 25;
  const sens = opts.sens ?? 1.0;
  const { prof, L, n } = sampleProfile(gray, W, H, p0, p1, band);
  const d = detrend(prof);

  // A caller counting one stack across several photos passes the pitch it
  // already measured. A short swipe holds too few repeats to measure spacing
  // reliably — on a split test run, per-segment estimates came out at 124px
  // where the true pitch was 49, and the total fell from 36 to 25.
  // Always measure, even when the caller supplies a pitch: the comparison is
  // what catches "saved a section, then photographed a different part".
  let measuredPx = fundamentalPitch(d);
  let pitchPx = opts.pitchPx || measuredPx;
  if (!pitchPx || !isFinite(pitchPx)) {
    const rough = findPeaks(d, std(d) * 0.3, 2);
    if (rough.length > 4) {
      const gaps = [];
      for (let i = 1; i < rough.length; i++) gaps.push(rough[i] - rough[i - 1]);
      gaps.sort((a, b) => a - b);
      pitchPx = gaps[gaps.length >> 1] / SS;
    } else pitchPx = 4;
  }
  const pitch = pitchPx * SS;

  // Peak detection cannot see an extremum at index 0 or n-1, so a part sitting
  // exactly at the end of the swipe is structurally invisible — a systematic
  // -1 on every photo. Pad with a low value: an end part becomes a real peak,
  // without inventing a neighbour that the spacing rule would then suppress.
  const pad = Math.max(3, Math.round(pitch * 0.75));
  const floor = percentile(d, 5);
  const dp = new Float64Array(d.length + 2 * pad).fill(floor);
  dp.set(d, pad);

  const pk = findPeaks(dp, std(d) * 0.40 / sens, Math.max(2, Math.round(pitch * 0.65)))
    .map(i => i - pad)
    .filter(i => i >= 0 && i < n);

  return {
    count: pk.length,
    positions: pk.map(i => i / (n - 1)),   // 0..1 along the swipe
    pitchPx,                               // the spacing actually used
    measuredPx,                            // what this swipe alone suggests
    lengthPx: L, samples: n
  };
}

/**
 * Do parallel scans either side of the swipe agree?
 *
 * A repeating stack gives the same count wherever you cut across it. Four
 * fingers, or any small set of irregular objects, does not. Measured spread
 * (std/mean of the counts): steel stacks 0.03-0.13, a hand of fingers
 * 0.24-0.30. This does NOT produce a better number — taking the median made
 * the steel counts worse — it only flags that the answer is unstable.
 */
function scansAgree(gray, W, H, p0, p1, opts = {}, nLines = 5, spread = 0.18) {
  const vx = p1.x - p0.x, vy = p1.y - p0.y;
  const L = Math.hypot(vx, vy);
  if (!L) return null;
  const ux = vx / L, uy = vy / L, px = -uy, py = ux;
  const step = L * spread / (nLines - 1);
  const counts = [];
  for (let i = 0; i < nLines; i++) {
    const o = (i - (nLines - 1) / 2) * step;
    const a = { x: p0.x + px * o, y: p0.y + py * o };
    const b = { x: p1.x + px * o, y: p1.y + py * o };
    if (a.x < 0 || a.y < 0 || a.x >= W || a.y >= H) continue;
    if (b.x < 0 || b.y < 0 || b.x >= W || b.y >= H) continue;
    try {
      counts.push(countAlongLine(gray, W, H, a, b, { ...opts, band: 15 }).count);
    } catch (e) { /* a scan that falls off the image just doesn't vote */ }
  }
  if (counts.length < 3) return null;
  const m = counts.reduce((s, c) => s + c, 0) / counts.length;
  if (m <= 0) return null;
  const sd = Math.sqrt(counts.reduce((s, c) => s + (c - m) * (c - m), 0) / counts.length);
  return (sd / m) < 0.18;
}

/* ------------------------------------------------- two-shot torch pairing */

/**
 * Find the (dx,dy) that best aligns image B onto image A.
 *
 * The two torch frames are taken a few hundred milliseconds apart, handheld,
 * so they are offset by a few pixels to a few tens of pixels. The photometric
 * difference below assumes pixel-for-pixel correspondence, so this is not
 * optional — an unaligned subtraction produces edge artefacts that look
 * exactly like parts.
 *
 * Coarse-to-fine: search a wide range on a heavily downsampled pair, then
 * refine at full resolution. Pure translation only; rotation over 300ms of
 * hand shake is small enough to ignore, and estimating it would cost far more
 * than it returns.
 */
function alignTranslation(a, b, W, H, maxShift = 48) {
  const shrink = (src, w, h, k) => {
    const nw = Math.max(8, Math.floor(w / k)), nh = Math.max(8, Math.floor(h / k));
    const out = new Float64Array(nw * nh);
    for (let y = 0; y < nh; y++) for (let x = 0; x < nw; x++) {
      let s = 0, n = 0;
      for (let j = 0; j < k; j++) for (let i = 0; i < k; i++) {
        const sy = y * k + j, sx = x * k + i;
        if (sy < h && sx < w) { s += src[sy * w + sx]; n++; }
      }
      out[y * nw + x] = s / Math.max(1, n);
    }
    return { d: out, w: nw, h: nh };
  };

  // Match on the GRADIENT, not the brightness. The whole point of the pair is
  // that brightness changes between the two frames; edges stay put.
  const grad = (src, w, h) => {
    const g = new Float64Array(w * h);
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const gx = src[y * w + x + 1] - src[y * w + x - 1];
      const gy = src[(y + 1) * w + x] - src[(y - 1) * w + x];
      g[y * w + x] = Math.sqrt(gx * gx + gy * gy);
    }
    return g;
  };

  function bestShift(ga, gb, w, h, range, step, cx, cy) {
    let best = { x: cx, y: cy, score: -Infinity };
    const m = Math.floor(Math.min(w, h) * 0.15);            // ignore the border
    for (let dy = cy - range; dy <= cy + range; dy += step) {
      for (let dx = cx - range; dx <= cx + range; dx += step) {
        let num = 0, na = 0, nb = 0;
        for (let y = m; y < h - m; y += 2) {
          const sy = y + dy; if (sy < 0 || sy >= h) continue;
          for (let x = m; x < w - m; x += 2) {
            const sx = x + dx; if (sx < 0 || sx >= w) continue;
            const va = ga[y * w + x], vb = gb[sy * w + sx];
            num += va * vb; na += va * va; nb += vb * vb;
          }
        }
        const s = num / (Math.sqrt(na * nb) + 1e-9);         // normalised correlation
        if (s > best.score) best = { x: dx, y: dy, score: s };
      }
    }
    return best;
  }

  // The coarse stage must not be able to reach further than maxShift once the
  // fine stage widens around it, or the search escapes the range the caller
  // asked for — and on a repeating pattern, escaping by one period gives a
  // confident, completely wrong answer.
  const k = Math.max(1, Math.min(4, Math.floor(maxShift / 3)));
  const A8 = shrink(a, W, H, k), B8 = shrink(b, W, H, k);
  const gA8 = grad(A8.d, A8.w, A8.h), gB8 = grad(B8.d, B8.w, B8.h);
  const coarse = bestShift(gA8, gB8, A8.w, A8.h,
                           Math.max(1, Math.floor(maxShift / k) - 1), 1, 0, 0);

  const gA = grad(a, W, H), gB = grad(b, W, H);
  const clamp = v => Math.max(-maxShift, Math.min(maxShift, v));
  const fine = bestShift(gA, gB, W, H, k, 1,
                         clamp(coarse.x * k), clamp(coarse.y * k));
  return { dx: clamp(fine.x), dy: clamp(fine.y), score: fine.score };
}

/**
 * Normalised difference of a lit / unlit pair: (lit - unlit) / (lit + unlit).
 *
 * Dividing by the sum cancels surface colour, so a painted mark or a saw
 * striation — which reflects both frames identically — drops out, while
 * anything whose response to the torch differs survives. With the torch beside
 * the lens that difference is mostly 1/r-squared falloff and the cosine of the
 * surface angle: near, square-on surfaces brighten most.
 */
function photometricPair(lit, unlit, W, H, dx, dy) {
  const out = new Float64Array(W * H);
  for (let y = 0; y < H; y++) {
    const sy = Math.min(H - 1, Math.max(0, y + dy));
    for (let x = 0; x < W; x++) {
      const sx = Math.min(W - 1, Math.max(0, x + dx));
      const L = lit[y * W + x], U = unlit[sy * W + sx];
      const s = L + U;
      out[y * W + x] = s > 1 ? ((L - U) / s) * 220 + 30 : 0;
    }
  }
  return out;
}

/* --------------------------------------------------------- image loading */

/** Draw an image into a canvas at the working width and return luminance. */
function toWorkingGrey(img, workW = WORK_W) {
  const scale = img.width > workW ? workW / img.width : 1;
  const W = Math.max(1, Math.round(img.width * scale));
  const H = Math.max(1, Math.round(img.height * scale));
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.imageSmoothingEnabled = true;
  g.imageSmoothingQuality = 'high';
  g.drawImage(img, 0, 0, W, H);
  const px = g.getImageData(0, 0, W, H).data;
  const grey = new Float64Array(W * H);
  for (let i = 0, j = 0; i < px.length; i += 4, j++) {
    // Rec.601 luma, matching PIL's "L" conversion
    grey[j] = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
  }
  return { grey, W, H, scale };
}

if (typeof window !== 'undefined') {

/* ======================================================================
   Build 8 — several swipes across one stack, voting.

   One swipe cannot tell a boundary between two parts from a scratch on one
   of them: both are a place where lightness changes fast. Several swipes
   can. A boundary runs all the way across the stack, so it appears in every
   swipe. A scratch, a burr, a blurred patch appears in one.

   Measured on a stack of 14 plates with blurred edges: four hand-drawn lines
   gave 4, 12, 11 and 6 on their own, and 14 together.

   The extra lines have to be placed by the person. Generating them
   automatically, parallel to the swipe, was tested and is worse than a single
   line — on two of six photos the generated lines wandered off the parts and
   the count collapsed. Where they fall is the information.
   ====================================================================== */

const M_COMMON = 1024;          // every swipe is stretched onto this ruler

/** Rows of the band around a line, each one its own 1-D slice of the photo. */
function bandRows(gray, W, H, p0, p1, band = 50, step = 2) {
  const vx = p1.x - p0.x, vy = p1.y - p0.y;
  const L = Math.hypot(vx, vy);
  const n = Math.max(16, Math.floor(L * SS));
  const ux = vx / L, uy = vy / L, px = -uy, py = ux;
  const rows = [];
  for (let o = -band; o <= band; o += step) {
    const r = new Float64Array(n);
    let ok = true;
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      const x = p0.x + vx * t + px * o, y = p0.y + vy * t + py * o;
      const xi = Math.min(W - 1, Math.max(0, Math.round(x)));
      const yi = Math.min(H - 1, Math.max(0, Math.round(y)));
      if (x < 0 || y < 0 || x > W - 1 || y > H - 1) ok = false;
      r[i] = gray[yi * W + xi];
    }
    if (ok) rows.push(r);
  }
  return { rows, n, L };
}

/** How fast is lightness changing here, judged against this row's own scale?
    Per row, so a dim row and a bright row get an equal vote. */
function edgeResponse(y, sigma = 3) {
  const s = gaussian1d(y, sigma);
  const n = s.length, d = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const a = s[Math.max(0, i - 1)], b = s[Math.min(n - 1, i + 1)];
    d[i] = Math.abs((b - a) / 2);
  }
  const sorted = Array.from(d).sort((a, b) => a - b);
  const med = sorted[sorted.length >> 1] + 1e-6;
  for (let i = 0; i < n; i++) d[i] /= med;
  return d;
}

/** Keep what nearly every row agrees on: a low quantile down each column. */
function quantileDown(R, n, q = 0.20) {
  const m = R.length, out = new Float64Array(n), col = new Float64Array(m);
  const idx = Math.min(m - 1, Math.max(0, Math.round(q * (m - 1))));
  for (let i = 0; i < n; i++) {
    for (let r = 0; r < m; r++) col[r] = R[r][i];
    const s = Array.prototype.slice.call(col).sort((a, b) => a - b);
    out[i] = s[idx];
  }
  return out;
}

function shiftRows(R, n, perRow) {
  const m = R.length, mid = (m - 1) / 2, out = new Array(m);
  for (let r = 0; r < m; r++) {
    const s = Math.round(perRow * (r - mid));
    const src = R[r], dst = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      let j = i - s; if (j < 0) j += n; if (j >= n) j -= n;
      dst[i] = src[j];
    }
    out[r] = dst;
  }
  return out;
}

/**
 * Edge strength along one swipe.
 *
 * Two things beyond the obvious. The boundary need not be perpendicular to the
 * swipe - a stack photographed from an angle has slanted edges - so the slant
 * that makes the rows line up is searched for. And the result is divided by its
 * own local average, so a faint boundary in a dim stretch of the photo competes
 * with a strong one in a bright stretch. That second step is levelling, which
 * build 6 applied to the brightness itself and thereby destroyed the signal.
 * Applied to edge strength it does what levelling was always meant to do.
 */
function boundaryScore(gray, W, H, p0, p1, opts = {}) {
  const { rows, n, L } = bandRows(gray, W, H, p0, p1, opts.band ?? 50, opts.step ?? 2);
  if (rows.length < 5 || n < 32) return null;
  const R = rows.map(y => edgeResponse(y, opts.sigma ?? 3));
  const cap = (opts.slantFrac ?? 0.015) * n;
  let best = { v: -Infinity, sc: null };
  for (let s = -12; s <= 12; s++) {
    const per = (cap * s / 12) / rows.length * 2;
    const sc = quantileDown(shiftRows(R, n, per), n);
    const sd = std(sc);
    if (sd > best.v) best = { v: sd, sc };
  }
  let sc = best.sc;
  const env = gaussian1d(sc, Math.max(4, n * (opts.levelWin ?? 0.07)));
  const floor = percentile(env, 25) * 0.5 + 1e-6;
  const out = new Float64Array(n);
  for (let i = 0; i < n; i++) out[i] = sc[i] / Math.max(env[i], floor);
  return { score: out, n, L };
}

function resampleZ(s, m = M_COMMON) {
  const n = s.length, out = new Float64Array(m);
  for (let i = 0; i < m; i++) {
    const t = i / (m - 1) * (n - 1), j = Math.floor(t), f = t - j;
    out[i] = j >= n - 1 ? s[n - 1] : s[j] * (1 - f) + s[j + 1] * f;
  }
  const mu = mean(out), sd = std(out) + 1e-9;
  for (let i = 0; i < m; i++) out[i] = (out[i] - mu) / sd;
  return out;
}

function warpCurve(s, a, b, m = M_COMMON) {
  const out = new Float64Array(m);
  for (let i = 0; i < m; i++) {
    const u = a * (i / (m - 1)) + b;
    const t = Math.min(1, Math.max(0, u)) * (m - 1);
    const j = Math.floor(t), f = t - j;
    out[i] = j >= m - 1 ? s[m - 1] : s[j] * (1 - f) + s[j + 1] * f;
  }
  return out;
}

/** Stretch and shift this curve until it agrees best with the first swipe.
    The stack is the same stack; the swipes just sample it in different places. */
function alignTo(ref, c) {
  let best = { corr: -2, a: 1, b: 0, curve: c };
  for (let ai = -15; ai <= 15; ai++) {
    const a = 1 + ai * 0.01;
    for (let bi = -14; bi <= 14; bi++) {
      const b = bi * 0.01;
      const w = warpCurve(c, a, b);
      const mu = mean(w), sd = std(w) + 1e-9;
      let s = 0;
      for (let i = 0; i < ref.length; i++) s += ref[i] * (w[i] - mu) / sd;
      s /= ref.length;
      if (s > best.corr) best = { corr: s, a, b, curve: w };
    }
  }
  const mu = mean(best.curve), sd = std(best.curve) + 1e-9;
  const z = new Float64Array(best.curve.length);
  for (let i = 0; i < z.length; i++) z[i] = (best.curve[i] - mu) / sd;
  return { corr: best.corr, a: best.a, b: best.b, curve: z };
}

function medianAcross(curves) {
  const m = curves[0].length, out = new Float64Array(m), col = new Array(curves.length);
  for (let i = 0; i < m; i++) {
    for (let k = 0; k < curves.length; k++) col[k] = curves[k][i];
    col.sort((a, b) => a - b);
    const h = col.length >> 1;
    out[i] = col.length % 2 ? col[h] : (col[h - 1] + col[h]) / 2;
  }
  return out;
}

/** Spacing of the repeat, as a fraction of the run. Harmonic product spectrum,
    so a boundary that shows as a bright line beside a dark one is not counted
    twice over. */
function pitchFraction(x, lo = 0.02, hi = 0.25, nHarm = 5) {
  const n = x.length;
  const m = mean(x);
  const w = new Float64Array(n);
  for (let i = 0; i < n; i++) {
    const han = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (n - 1));
    w[i] = (x[i] - m) * han;
  }
  const { P, N } = realPower(w, n * 4);
  const prod = Float64Array.from(P);
  for (let h = 2; h <= nHarm; h++) {
    for (let i = 0; i < P.length; i++) {
      const j = i * h;
      prod[i] *= Math.pow((j < P.length ? P[j] : 0) + 1e-12, 1 / h);
    }
  }
  let bestK = 0, bestV = -1;
  for (let k = 1; k < P.length; k++) {
    const cycles = k * n / N;                  // repeats across the whole run
    if (cycles < 1 / hi || cycles > 1 / lo) continue;
    if (prod[k] > bestV) { bestV = prod[k]; bestK = k; }
  }
  if (!bestK) return 0.05;
  return 1 / (bestK * n / N);
}

function rankBoundaries(sc, pitchFrac) {
  const n = sc.length;
  const s = gaussian1d(sc, Math.max(1, n * pitchFrac * 0.10));
  const dist = Math.max(2, Math.round(n * pitchFrac * 0.55));
  let peaks = localMaxima(s);
  if (!peaks.length) return { pos: [], dep: [], smooth: s };
  const pr = prominences(s, peaks);
  peaks = selectByDistance(peaks, peaks.map(i => s[i]), dist);
  const prSel = prominences(s, peaks);
  const order = peaks.map((_, i) => i).sort((a, b) => prSel[b] - prSel[a]);
  return { pos: order.map(i => peaks[i]), dep: order.map(i => prSel[i]), smooth: s };
}

/**
 * How many of the ranked boundaries are real?
 *
 * Two rules, and which one fires is itself informative. If the depths fall off
 * a cliff, take everything above it - that needs no assumption at all, and on a
 * hand of fingers the cliff is 80x. If they do not, fall back to whichever
 * number of boundaries is most evenly spaced. That IS the spacing assumption,
 * and it is wrong for irregular objects - but it is only choosing where to stop
 * in a list the boundaries are already at the top of, not finding them.
 */
function chooseCut(pos, dep, expected, lambda = 0.25) {
  if (dep.length < 3) return { k: dep.length, how: 'too few', cliff: 1, cv: NaN };
  const lim = 0.12 * dep[0];
  let k1 = 1, r1 = -1;
  for (let i = 1; i <= Math.min(dep.length - 1, 200); i++) {
    if (dep[i - 1] < lim) break;
    const r = dep[i - 1] / Math.max(dep[i], 1e-9);
    if (r > r1) { r1 = r; k1 = i; }
  }
  if (r1 >= 4.0) return { k: k1, how: 'cliff', cliff: r1, cv: NaN };
  // The measured pitch says roughly how many boundaries there should be. Let
  // the regularity rule choose only near that. Without this bound it is free to
  // pick three boundaries that happen to be evenly spaced and call a stack of
  // 26 plates four parts, which is exactly what it did.
  let kLo = 3, kHi = Math.min(pos.length, 200);
  if (expected && isFinite(expected) && expected >= 2) {
    kLo = Math.max(2, Math.floor(expected * 0.65));
    kHi = Math.min(pos.length, Math.ceil(expected * 1.5));
    if (kHi < kLo) kHi = Math.min(pos.length, kLo);
  }
  let bestCv = Infinity, k2 = Math.min(Math.max(k1, kLo), kHi);
  for (let k = kLo; k <= kHi; k++) {
    const t = pos.slice(0, k).slice().sort((a, b) => a - b);
    const g = []; for (let i = 1; i < t.length; i++) g.push(t[i] - t[i - 1]);
    const m = mean(g); if (!m) continue;
    // Regularity alone quietly prefers the smallest k: two boundaries are
    // always perfectly evenly spaced. Penalise drifting away from the pitch the
    // spectrum measured.
    const pen = expected ? lambda * Math.abs(k - expected) / expected : 0;
    const cv = std(g) / m + pen;
    if (cv < bestCv) { bestCv = cv; k2 = k; }
  }
  return { k: k2, how: 'spacing', cliff: r1, cv: bestCv };
}

/**
 * The whole thing. `lines` is one or more swipes across the same stack.
 * Returns the count and, for each swipe, where the boundaries fall along it.
 */
function countAcrossLines(gray, W, H, lines, opts = {}) {
  const scored = [];
  for (const ln of lines) {
    const r = boundaryScore(gray, W, H, ln.p0, ln.p1, opts);
    if (r) scored.push({ ...r, z: resampleZ(r.score) });
  }
  if (!scored.length) throw new Error('Swipe across the parts, not along them.');

  const ref = scored[0].z;
  const maps = [{ a: 1, b: 0, corr: 1 }];
  const curves = [ref];
  for (let i = 1; i < scored.length; i++) {
    const al = alignTo(ref, scored[i].z);
    maps.push({ a: al.a, b: al.b, corr: al.corr });
    curves.push(al.curve);
  }
  const cons = curves.length > 1 ? medianAcross(curves) : ref;

  const pf = pitchFraction(cons);
  const { pos, dep, smooth } = rankBoundaries(cons, pf);
  const cut = chooseCut(pos, dep, Math.max(1, 1 / pf - 1), opts.regPenalty ?? 0.10);
  const kept = pos.slice(0, cut.k).slice().sort((a, b) => a - b);
  const m = cons.length;

  // Back onto each swipe: consensus position t maps to a*t + b on swipe i.
  const perLine = maps.map(mp => kept.map(p => {
    const t = p / (m - 1);
    return Math.min(1, Math.max(0, mp.a * t + mp.b));
  }));

  const centres = [];
  const edges = [0, ...kept.map(p => p / (m - 1)), 1];
  for (let i = 0; i < edges.length - 1; i++) centres.push((edges[i] + edges[i + 1]) / 2);

  const agree = maps.length > 1
    ? maps.slice(1).reduce((s, x) => s + x.corr, 0) / (maps.length - 1) : null;

  return {
    count: centres.length,
    positions: centres,            // along the FIRST swipe, for the ticks
    boundaries: perLine,           // per swipe, 0..1 along that swipe
    nLines: scored.length,
    agree,                         // how well the swipes corroborate each other
    cliff: cut.cliff, how: cut.how, cv: cut.cv,
    pitchFrac: pf,
    pitchPx: scored[0].L / Math.max(1, centres.length),
    lengthPx: scored[0].L, samples: scored[0].n
  };
}

  window.StackEngine = {
    SS, WORK_W, countAcrossLines, boundaryScore, countAlongLine, countPeaksLegacy, scansAgree,
    alignTranslation, photometricPair,
    toWorkingGrey, sampleProfile, detrend, flatten, valleyDepths, cutAtCliff,
    fundamentalPitch, findPeaks, gaussian1d, std, percentile
  };
}
</script>
<script>
/* ===========================================================================
   Swipe Count — UI layer. The engine does the measuring; this decides what
   the line is, shows every decision as a tick you can correct, and keeps a
   running total across sections of a long stack.
   =========================================================================== */
"use strict";

const $ = s => document.querySelector(s);
const el = {
  total: $('#total'), totalLab: $('#totalLab'), stage: $('#stage'), wrap: $('#wrap'),
  view: $('#view'), empty: $('#empty'), hint: $('#hint'), busy: $('#busy'),
  fileCam: $('#fileCam'), fileLib: $('#fileLib'), sheet: $('#sheet'),
  sheetBody: $('#sheetBody'), secBar: $('#secBar'), sens: $('#sensVal'),
  tools: $('#tools'), pitchVal: $('#pitchVal')
};

// Bump this on every release. It is the only reliable way to tell, from the
// phone, whether the published site is the version you think it is — caches and
// home-screen shortcuts both hold onto old copies quietly.
const BUILD = 'build 8 - 14 Sep 2026';

const LS = { sens: 'swipe.sens', work: 'swipe.work' };
const get = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } };
const set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { } };

const S = {
  img: null,            // the drawn photo (canvas) at working size
  grey: null, W: 0, H: 0,
  line: null,           // {p0:{x,y}, p1:{x,y}} in working pixels
  marks: [],            // [{t, src}] t = 0..1 along the line
  pitchPx: null,        // locked after the first section
  lockPitch: false,
  lines: [],            // every swipe across this stack
  cliff: null,
  valleys: [],
  sections: [],         // [{count, manual}] committed sections
  sens: parseFloat(get(LS.sens, '1')) || 1,
  drag: null,
  busy: false,
  agree: null,         // did parallel scans agree? null until a count is run
  pairLit: null, pairDiff: null, pairLitCanvas: null, pairDiffCanvas: null,
  source: 'photo', torched: false
};

/* ---------------------------------------------------------- photo loading */
async function loadFile(file) {
  if (!file) return;
  showBusy('Reading photo…');
  try {
    let src;
    try { src = await createImageBitmap(file); }
    catch (e) {
      src = await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i); i.onerror = () => rej(new Error('Could not read that image.'));
        i.src = URL.createObjectURL(file);
      });
    }
    const workW = parseInt(get(LS.work, String(StackEngine.WORK_W)), 10) || StackEngine.WORK_W;
    const { grey, W, H } = StackEngine.toWorkingGrey(src, workW);

    // Keep a drawn copy at the SAME size the engine measured, so a swipe on
    // screen and a measurement in the engine use one coordinate system.
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    c.getContext('2d').drawImage(src, 0, 0, W, H);
    if (src.close) src.close();

    S.img = c; S.grey = grey; S.W = W; S.H = H;
    S.pairLit = S.pairDiff = null; S.source = 'photo';
    const tog = document.getElementById('srcTog'); if (tog) tog.hidden = true;
    S.line = null; S.lines = []; S.marks = [];
    el.view.width = W; el.view.height = H;
    el.empty.style.display = 'none';
    fitToStage(); draw(); updateTotal(); setHint();
  } catch (e) {
    openError(e.message || String(e));
  } finally { hideBusy(); }
}
el.fileCam.addEventListener('change', e => loadFile(e.target.files[0]));
el.fileLib.addEventListener('change', e => loadFile(e.target.files[0]));
$('#shoot').onclick = $('#shootEmpty').onclick = () => el.fileCam.click();
$('#pick').onclick = $('#pickEmpty').onclick = () => el.fileLib.click();

/* ------------------------------------------------------------ pan / zoom */
const V = { s: 1, x: 0, y: 0 };
function applyView() { el.wrap.style.transform = `translate(${V.x}px,${V.y}px) scale(${V.s})`; }
function fitToStage() {
  const r = el.stage.getBoundingClientRect();
  const s = Math.min(r.width / S.W, r.height / S.H) * 0.98;
  V.s = s; V.x = (r.width - S.W * s) / 2; V.y = (r.height - S.H * s) / 2;
  applyView();
}
window.addEventListener('resize', () => { if (S.img) fitToStage(); });

function toImage(cx, cy) {
  const r = el.stage.getBoundingClientRect();
  return { x: (cx - r.left - V.x) / V.s, y: (cy - r.top - V.y) / V.s };
}

const P = new Map();
let pinch = null, tapC = null;

el.stage.addEventListener('pointerdown', e => {
  // The camera overlay lives inside #stage, so without this the swipe handler
  // calls setPointerCapture and steals the pointer from the shutter button —
  // which then never receives its click. Only bites once a photo is loaded,
  // because otherwise this handler returns early anyway.
  const cam = document.getElementById('cam');
  if (cam && !cam.hidden) return;
  if (!S.img || S.busy) return;
  el.stage.setPointerCapture(e.pointerId);
  P.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (P.size === 1) {
    tapC = { x: e.clientX, y: e.clientY, t: Date.now(), moved: 0 };
    S.drag = { p0: toImage(e.clientX, e.clientY), p1: toImage(e.clientX, e.clientY) };
  } else if (P.size === 2) {
    tapC = null; S.drag = null;                       // two fingers is never a swipe
    const [a, b] = [...P.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2,
              s: V.s, vx: V.x, vy: V.y };
    draw();
  }
});

el.stage.addEventListener('pointermove', e => {
  if (!P.has(e.pointerId)) return;
  const prev = P.get(e.pointerId);
  P.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (P.size === 1) {
    if (tapC) tapC.moved += Math.abs(e.clientX - prev.x) + Math.abs(e.clientY - prev.y);
    if (S.drag) { S.drag.p1 = toImage(e.clientX, e.clientY); draw(); }
  } else if (P.size === 2 && pinch) {
    const [a, b] = [...P.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
    const k = Math.max(.1, Math.min(16, pinch.s * (d / pinch.d)));
    const r = el.stage.getBoundingClientRect();
    V.x = cx - r.left - (pinch.cx - r.left - pinch.vx) * (k / pinch.s);
    V.y = cy - r.top - (pinch.cy - r.top - pinch.vy) * (k / pinch.s);
    V.s = k; applyView();
  }
});

function endPointer(e) {
  if (!P.has(e.pointerId)) return;
  P.delete(e.pointerId);
  if (P.size < 2) pinch = null;
  if (P.size !== 0) { S.drag = null; return; }

  const drag = S.drag; S.drag = null;
  const tap = tapC; tapC = null;

  if (tap && Date.now() - tap.t < 450 && tap.moved < 12) { handleTap(tap.x, tap.y); return; }
  if (drag) {
    const len = Math.hypot(drag.p1.x - drag.p0.x, drag.p1.y - drag.p0.y);
    // A swipe shorter than this is a slip, not an instruction.
    if (len > Math.min(S.W, S.H) * 0.08) {
      // Every swipe is another look at the same stack, not a replacement for
      // the last one. A boundary between two parts is crossed by all of them;
      // a scratch on one part is crossed by one.
      if (S.lines.length >= 6) S.lines.shift();
      S.lines.push(drag);
      S.line = S.lines[0];
      runCount();
    }
    else draw();
  }
}
el.stage.addEventListener('pointerup', endPointer);
el.stage.addEventListener('pointercancel', endPointer);

/* ------------------------------------------------------------- tap to fix */
function lineGeom() {
  const { p0, p1 } = S.line;
  const vx = p1.x - p0.x, vy = p1.y - p0.y;
  const L = Math.hypot(vx, vy);
  return { p0, p1, vx, vy, L, ux: vx / L, uy: vy / L };
}
function markPoint(t) {
  const g = lineGeom();
  return { x: g.p0.x + t * g.vx, y: g.p0.y + t * g.vy };
}

function handleTap(cx, cy) {
  if (!S.line) return;
  const p = toImage(cx, cy);
  const g = lineGeom();

  // The hit radius must stay under half the part spacing. Any larger and a tap
  // meant to ADD a tick between two parts always lands on a neighbour instead,
  // so deleting one and tapping again just deletes another. Below a usable
  // finger size on screen, editing is refused rather than made unreliable.
  const hit = (S.pitchPx || 20) * 0.45;
  if (hit * V.s < 13) { toast('Pinch to zoom in, then tap to fix a tick'); return; }

  let bi = -1, bd = Infinity;
  S.marks.forEach((m, i) => {
    const q = markPoint(m.t);
    const d = Math.hypot(q.x - p.x, q.y - p.y);
    if (d < bd) { bd = d; bi = i; }
  });
  if (bi >= 0 && bd <= hit) { S.marks.splice(bi, 1); updateTotal(); draw(); return; }

  // project the tap onto the line; only accept taps that are actually near it
  const t = ((p.x - g.p0.x) * g.vx + (p.y - g.p0.y) * g.vy) / (g.L * g.L);
  const perp = Math.abs((p.x - g.p0.x) * -g.uy + (p.y - g.p0.y) * g.ux);
  if (t < 0 || t > 1 || perp > hit * 2.5) return;
  S.marks.push({ t, src: 'me' });
  S.marks.sort((a, b) => a.t - b.t);
  updateTotal(); draw();
}

/* ----------------------------------------------------------------- count */
async function runCount() {
  if (!S.line || S.busy) return;
  S.busy = true; showBusy('Counting…');
  await new Promise(r => setTimeout(r, 16));          // let the spinner paint
  try {
    const r = StackEngine.countAcrossLines(S.grey, S.W, S.H, S.lines, { sens: S.sens });

    S.pitchPx = r.pitchPx;
    S.cliff = r.cliff; S.how = r.how; S.agree = r.agree; S.nLines = r.nLines;
    S.bounds = r.boundaries;
    S.marks = r.positions.map(t => ({ t, src: 'ai' }));
    updateTotal(); draw();

    if (S.lines.length === 1 && r.how === 'spacing') {
      warn('One swipe cannot separate a gap between parts from a mark on one. ' +
           'Swipe again somewhere else across the same stack — two or three more ' +
           'and it can vote.');
    } else if (r.agree !== null && r.agree < 0.30) {
      warn('These swipes disagree with each other. Are they all crossing the ' +
           'same run of parts, square-on, first part to last?');
    } else setHint();
  } catch (e) {
    openError(e.message || String(e));
  } finally { S.busy = false; hideBusy(); }
}

function bumpSens(delta) {
  S.sens = Math.max(0.4, Math.min(2.5, +(S.sens + delta).toFixed(2)));
  set(LS.sens, String(S.sens));
  el.sens.textContent = S.sens.toFixed(2).replace(/0$/, '');
  if (S.line) runCount();
}
$('#sensDown').onclick = () => bumpSens(-0.1);
$('#sensUp').onclick = () => bumpSens(+0.1);

/* -------------------------------------------------------------- sections */
$('#addSection').onclick = () => {
  if (!S.marks.length) return;
  S.sections.push({ count: S.marks.length });
  S.line = null; S.lines = []; S.marks = [];
  updateTotal(); draw(); setHint();
  toast(`Section saved. Take the next photo — the running total keeps counting.`);
};
$('#clearAll').onclick = () => {
  S.sections = []; S.marks = []; S.line = null; S.lines = []; S.pitchPx = null;
  updateTotal(); draw(); setHint();
};

function updateTotal() {
  const here = S.marks.length;
  const prior = S.sections.reduce((a, s) => a + s.count, 0);
  el.total.textContent = S.img ? (prior + here) : '—';
  const manual = S.marks.filter(m => m.src === 'me').length;
  const bits = [];
  if (S.sections.length) bits.push(`${S.sections.length} saved + ${here} here`);
  if (manual) bits.push(`${manual} by hand`);
  el.totalLab.textContent = bits.length ? bits.join(' · ') : 'count';
  // The bar carries the Photo/Torch source toggle and, once there is a count,
  // how cleanly the separations stood out from everything else.
  el.tools.hidden = !(S.line || S.pairDiff);
  // looked up rather than cached: updateTotal() runs once at start-up, before
  // the torch section further down has assigned its element references
  const tog = document.getElementById('srcTog');
  if (tog) tog.hidden = !S.pairDiff;
  const lab = document.querySelector('#cliffLab');
  if (lab) {
    lab.hidden = !(S.line && S.marks.length);
    if (!lab.hidden) {
      const n = S.nLines || S.lines.length;
      const bits = [n === 1 ? '1 swipe' : n + ' swipes'];
      if (S.agree != null) bits.push('agreement ' + S.agree.toFixed(2));
      bits.push(S.how === 'cliff'
        ? 'clear gaps (' + (S.cliff || 0).toFixed(1) + '\u00d7)'
        : 'even spacing');
      lab.textContent = bits.join(' \u00b7 ');
      const good = (S.how === 'cliff' && S.cliff >= 4) || (S.agree != null && S.agree >= 0.45);
      const bad  = n === 1 && S.how !== 'cliff';
      lab.className = 'lab' + (good ? ' good' : bad ? ' bad' : '');
    }
  }
  el.secBar.hidden = !S.sections.length;
  el.secBar.textContent = S.sections.length
    ? 'sections: ' + S.sections.map(s => s.count).join(' + ') + (here ? ` + ${here}` : '')
    : '';
  $('#addSection').disabled = !S.marks.length;
}

/* ------------------------------------------------------------------ draw */
function draw() {
  const c = el.view, g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  if (S.img) g.drawImage(S.img, 0, 0);

  const live = S.drag;
  if (live) {
    g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = Math.max(2, 3 / V.s);
    g.setLineDash([8 / V.s, 8 / V.s]);
    g.beginPath(); g.moveTo(live.p0.x, live.p0.y); g.lineTo(live.p1.x, live.p1.y); g.stroke();
    g.setLineDash([]);
    return;
  }
  if (!S.line) return;

  const g2 = lineGeom();
  const tick = Math.max(10, (S.pitchPx || 20) * 0.75);
  const lw = Math.max(1.5, 2.2 / V.s);

  // every swipe, the first one brightest
  S.lines.forEach((ln, li) => {
    g.strokeStyle = li === 0 ? 'rgba(255,60,60,.8)' : 'rgba(255,120,120,.55)';
    g.lineWidth = lw;
    g.beginPath(); g.moveTo(ln.p0.x, ln.p0.y); g.lineTo(ln.p1.x, ln.p1.y); g.stroke();
  });

  // The boundaries the count is built from, drawn on every swipe that voted.
  // Seeing them line up across the swipes is the whole idea made visible.
  if (S.bounds && S.bounds.length) {
    const t2 = Math.max(7, (S.pitchPx || 20) * 0.34);
    g.strokeStyle = 'rgba(0,214,255,.9)'; g.lineWidth = lw * 1.4;
    S.bounds.forEach((list, li) => {
      const ln = S.lines[li]; if (!ln) return;
      const vx = ln.p1.x - ln.p0.x, vy = ln.p1.y - ln.p0.y;
      const L = Math.hypot(vx, vy), ux = vx / L, uy = vy / L;
      list.forEach(t => {
        const qx = ln.p0.x + vx * t, qy = ln.p0.y + vy * t;
        g.beginPath();
        g.moveTo(qx + uy * t2, qy - ux * t2);
        g.lineTo(qx - uy * t2, qy + ux * t2);
        g.stroke();
      });
    });
  }

  const showNum = V.s * (S.pitchPx || 20) > 26;
  S.marks.forEach((m, i) => {
    const q = markPoint(m.t);
    const nx = -g2.uy * tick, ny = g2.ux * tick;
    g.lineWidth = lw * 3.4; g.strokeStyle = 'rgba(4,8,14,.8)';
    g.beginPath(); g.moveTo(q.x - nx, q.y - ny); g.lineTo(q.x + nx, q.y + ny); g.stroke();
    g.lineWidth = lw * 1.7;
    g.strokeStyle = m.src === 'me' ? '#ffb454' : '#4ce39a';
    g.beginPath(); g.moveTo(q.x - nx, q.y - ny); g.lineTo(q.x + nx, q.y + ny); g.stroke();
    if (showNum) {
      const fs = Math.max(9, tick * 0.62);
      g.font = `600 ${fs}px -apple-system,system-ui,sans-serif`;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      const lx = q.x + nx * 1.5, ly = q.y + ny * 1.5;
      g.lineWidth = fs * 0.3; g.strokeStyle = 'rgba(4,8,14,.85)';
      g.strokeText(i + 1, lx, ly);
      g.fillStyle = '#fff'; g.fillText(i + 1, lx, ly);
    }
  });
}

/* ------------------------------------------------------------------ chrome */
function setHint() {
  el.hint.className = 'hint';
  if (!S.img) return;
  el.hint.textContent = !S.lines.length
    ? 'Swipe from the middle of the FIRST part to the middle of the LAST'
    : (S.lines.length < 3
       ? 'Now swipe again somewhere else across the same parts — the swipes vote'
       : 'Tap a tick to remove · tap the line to add · swipe again to add another vote');
}
function toast(msg) { el.hint.textContent = msg; el.hint.className = 'hint'; setTimeout(setHint, 5000); }
function warn(msg) { el.hint.textContent = msg; el.hint.className = 'hint warn'; }

function showBusy(t) { el.busy.textContent = t; el.busy.hidden = false; }
function hideBusy() { el.busy.hidden = true; }

$('#saveBtn').onclick = async () => {
  if (!S.img) return;
  const c = document.createElement('canvas');
  c.width = S.W; c.height = S.H;
  const g = c.getContext('2d');
  g.drawImage(el.view, 0, 0);
  const n = S.sections.reduce((a, s) => a + s.count, 0) + S.marks.length;
  const fs = Math.round(Math.min(S.W, S.H) * 0.075), pad = Math.round(Math.min(S.W, S.H) * 0.035);
  g.font = `700 ${fs}px -apple-system,system-ui,sans-serif`;
  const w = g.measureText(String(n)).width;
  g.fillStyle = 'rgba(6,10,16,.8)';
  g.beginPath(); g.roundRect(pad, pad, w + fs, fs * 1.5, fs * 0.26); g.fill();
  g.fillStyle = '#4ce39a'; g.textBaseline = 'middle';
  g.fillText(String(n), pad + fs * 0.5, pad + fs * 0.78);
  const name = `count-${n}.jpg`;
  c.toBlob(async blob => {
    const file = new File([blob], name, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/jpeg', 0.9);
};

$('#cfgBtn').onclick = openSettings;
el.sheet.addEventListener('click', e => { if (e.target === el.sheet) el.sheet.classList.remove('on'); });

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function openSettings() {
  const work = get(LS.work, String(StackEngine.WORK_W));
  el.sheetBody.innerHTML = `
    <h2>Settings</h2>
    <div class="sub">Everything runs on this phone. No account, no network, no cost.</div>
    <div class="kv"><span>Version</span><b>${BUILD}</b></div>

    <label>How it counts</label>
    <div class="note">Every swipe you make across the same stack is another vote.
    A boundary between two parts is crossed by all of them; a scratch, a burr or a
    blurred patch is crossed by one, and loses. Measured on a stack of 14 plates with
    blurred edges, four swipes gave 4, 12, 11 and 6 on their own and 14 together.<br><br>
    Two or three swipes, well apart, square across the parts, each starting on the first
    part and ending on the last. Six is the most it keeps.</div>

    <div class="kv"><span>Swipes in the vote</span><b>${S.nLines || S.lines.length || 0}</b></div>
    <div class="kv"><span>Agreement between them</span><b>${S.agree == null ? '\u2014' : S.agree.toFixed(2)}</b></div>
    <div class="kv"><span>Where it stopped counting</span><b>${S.how === 'cliff' ? 'a clear break in the gaps' : S.how ? 'even spacing' : '\u2014'}</b></div>
    <div class="note">Agreement is how well the swipes corroborate each other, 0 to 1.
    Below about 0.3 they are not looking at the same run of parts.<br><br>
    <b>A clear break</b> means the gaps it kept were far deeper than anything it rejected
    \u2014 no assumption needed, and on a hand of fingers this reads 20\u201380\u00d7.
    <b>Even spacing</b> means it fell back to picking the number of gaps that comes out most
    regular. That assumes the parts are alike and evenly stacked. It is the weakest step

    <label for="ww">Working width</label>
    <input type="number" id="ww" value="${esc(work)}" min="800" max="6000" step="100">
    <div class="note">The photo is shrunk to this width before measuring. Counter-intuitive but
    load-bearing: at full resolution the saw marks on cut faces are themselves a strong regular
    pattern and get counted as parts. 2200 was calibrated against four hand-counted photos —
    if your parts are much finer or coarser, this is the knob to turn.</div>

    <div class="row">
      <button class="ghost" id="clr2">Clear everything</button>
      <button class="primary" id="ok">Done</button>
    </div>`;
  const bodyq = s => el.sheetBody.querySelector(s);

  bodyq('#clr2').onclick = () => { $('#clearAll').click(); el.sheet.classList.remove('on'); };
  bodyq('#ok').onclick = () => {
    const v = parseInt(bodyq('#ww').value, 10);
    if (v >= 800 && v <= 6000) set(LS.work, String(v));
    el.sheet.classList.remove('on');

}

function openError(msg) {
  el.sheetBody.innerHTML = `
    <h2>Couldn't do that</h2>
    <div class="sub">Your photo and any ticks are still here.</div>
    <div class="err">${esc(msg)}</div>
    <div class="row"><button class="primary" id="ok2">OK</button></div>`;
  el.sheetBody.querySelector('#ok2').onclick = () => el.sheet.classList.remove('on');
  el.sheet.classList.add('on');
}

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    this.beginPath(); this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r);
    this.closePath(); return this;
  };
}
document.addEventListener('gesturestart', e => e.preventDefault());
el.sens.textContent = S.sens.toFixed(2).replace(/0$/, '');
const bt = document.getElementById('buildTag');
if (bt) bt.textContent = BUILD;
updateTotal();

/* ===========================================================================
   Torch pair — two frames a few hundred milliseconds apart, one lit by the
   phone's torch and one not, differenced to suppress surface marking.

   This is an experiment, not a proven feature. What it can and cannot do:

   CAN    remove whatever the ambient light was doing, and keep only the part
          of the image that responds to a known light in a known place.
          Measured on synthetic data, a painted mark's importance relative to
          the parts fell 5.4x (0.92 -> 0.17).
   CANNOT cast the raking shadows that made the two-lamp simulation work. The
          torch sits ~1cm from the lens, which is the flattest possible
          lighting. What survives is 1/r-squared falloff and the cosine of the
          surface angle: near, square-on surfaces brighten most.
   =========================================================================== */

const TORCH_SETTLE_MS = 350;   // torch ramp + auto-exposure settling

el.cam = $('#cam'); el.camView = $('#camView'); el.camNote = $('#camNote');
el.srcTog = $('#srcTog');

let camStream = null, camTrack = null;

function frameToGrey(video, workW) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const k = vw > workW ? workW / vw : 1;
  const W = Math.max(1, Math.round(vw * k)), H = Math.max(1, Math.round(vh * k));
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(video, 0, 0, W, H);
  const px = g.getImageData(0, 0, W, H).data;
  const grey = new Float64Array(W * H);
  for (let i = 0, j = 0; i < px.length; i += 4, j++)
    grey[j] = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
  return { grey, W, H, canvas: c };
}

async function openTorchCam() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    openError('This browser will not give a web page camera access.'); return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' },
               width: { ideal: 3840 }, height: { ideal: 2160 } },
      audio: false
    });
  } catch (e) {
    openError('Camera access was refused.\n\n' + (e.message || e.name || ''));
    return;
  }
  camTrack = camStream.getVideoTracks()[0];
  el.camView.srcObject = camStream;
  el.cam.hidden = false;
  try { await el.camView.play(); } catch (e) { }

  const caps = camTrack.getCapabilities ? camTrack.getCapabilities() : {};
  const s = camTrack.getSettings ? camTrack.getSettings() : {};
  if (!('torch' in caps)) {
    el.camNote.textContent = `No torch control on this device — it will take two ` +
      `identical frames, which tells you nothing. ${s.width || '?'}x${s.height || '?'}`;
    el.camNote.style.color = '#ffb454';
  } else {
    el.camNote.textContent = `Hold as still as you can · ${s.width || '?'}x${s.height || '?'}`;
  }
}

function closeTorchCam() {
  if (camTrack) {
    // fire and forget — never await on the way out
    try { camTrack.applyConstraints({ advanced: [{ torch: false }] }).catch(() => {}); } catch (e) { }
  }
  if (camStream) camStream.getTracks().forEach(t => t.stop());
  camStream = null; camTrack = null;
  el.camView.srcObject = null;
  el.cam.hidden = true;
}

const wait = ms => new Promise(r => setTimeout(r, ms));

/** Never let a camera call hang the capture. applyConstraints is supposed to
    settle promptly, but an implementation that simply never resolves would
    freeze the app with the torch on and no way back. */
function withTimeout(promise, ms, label) {
  return Promise.race([
    Promise.resolve(promise),
    new Promise((_, rej) => setTimeout(() => rej(new Error(label + ' timed out')), ms))
  ]);
}

async function shootPair() {
  if (!camTrack) return;
  $('#camShoot').disabled = true;
  const workW = parseInt(get(LS.work, String(StackEngine.WORK_W)), 10) || StackEngine.WORK_W;
  try {
    el.camNote.textContent = 'unlit…';
    const unlit = frameToGrey(el.camView, workW);

    let torched = false;
    try {
      await withTimeout(camTrack.applyConstraints({ advanced: [{ torch: true }] }),
                        1200, 'torch on');
      torched = !!(camTrack.getSettings && camTrack.getSettings().torch);
    } catch (e) { torched = false; }
    // Settling matters more than speed here: the torch ramps up and the camera
    // re-exposes. Shooting immediately catches the transition, which aligns
    // badly and differences worse.
    await wait(TORCH_SETTLE_MS);

    el.camNote.textContent = 'lit…';
    const lit = frameToGrey(el.camView, workW);
    try { await withTimeout(camTrack.applyConstraints({ advanced: [{ torch: false }] }),
                            1200, 'torch off'); } catch (e) { }

    if (unlit.W !== lit.W || unlit.H !== lit.H) throw new Error('The two frames came back different sizes.');
    closeTorchCam();
    showBusy('Aligning the pair…');
    await wait(16);

    // Count on the lit frame first, purely to learn the part spacing, so the
    // alignment search can be bounded below half of it. An unbounded search on
    // a repeating pattern locks onto the wrong repeat with high confidence.
    let maxShift = 12;
    try {
      const probe = StackEngine.countAlongLine(lit.grey, lit.W, lit.H,
        { x: lit.W * 0.5, y: lit.H * 0.08 }, { x: lit.W * 0.5, y: lit.H * 0.92 }, {});
      if (probe.pitchPx > 6) maxShift = Math.max(4, Math.min(24, Math.round(probe.pitchPx * 0.4)));
    } catch (e) { }

    const al = StackEngine.alignTranslation(unlit.grey, lit.grey, lit.W, lit.H, maxShift);
    const diff = StackEngine.photometricPair(lit.grey, unlit.grey, lit.W, lit.H, al.dx, al.dy);

    S.pairLit = lit.grey; S.pairDiff = diff;
    S.pairLitCanvas = lit.canvas;
    S.pairDiffCanvas = greyToCanvas(diff, lit.W, lit.H);
    S.torched = torched;
    S.W = lit.W; S.H = lit.H;
    S.line = null; S.lines = []; S.marks = []; S.pitchPx = null;
    setSource('diff');
    el.empty.style.display = 'none';
    el.view.width = S.W; el.view.height = S.H;
    fitToStage(); draw(); updateTotal();
    if (!torched) warn('The torch would not turn on, so both frames are the same. ' +
                       'The difference image is meaningless.');
    else toast(`Pair taken, shifted by ${al.dx}, ${al.dy} px. Swipe across the parts.`);
  } catch (e) {
    closeTorchCam();
    openError(e.message || String(e));
  } finally {
    $('#camShoot').disabled = false;
    hideBusy();
  }
}

function greyToCanvas(grey, W, H) {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const im = g.createImageData(W, H);
  for (let i = 0, j = 0; i < grey.length; i++, j += 4) {
    const v = Math.max(0, Math.min(255, grey[i] | 0));
    im.data[j] = im.data[j + 1] = im.data[j + 2] = v; im.data[j + 3] = 255;
  }
  g.putImageData(im, 0, 0);
  return c;
}

function setSource(which) {
  if (!S.pairDiff) return;
  S.source = which;
  S.grey = which === 'diff' ? S.pairDiff : S.pairLit;
  S.img = which === 'diff' ? S.pairDiffCanvas : S.pairLitCanvas;
  $('#srcDiff').classList.toggle('on', which === 'diff');
  $('#srcPhoto').classList.toggle('on', which !== 'diff');
  draw();
  if (S.line) runCount();
}

// belt and braces: nothing inside the camera overlay should reach the stage
['pointerdown', 'pointermove', 'pointerup'].forEach(ev =>
  el.cam.addEventListener(ev, e => e.stopPropagation()));

$('#torchBtn').onclick = $('#torchEmpty').onclick = openTorchCam;
$('#camCancel').onclick = closeTorchCam;
$('#camShoot').onclick = shootPair;
$('#srcPhoto').onclick = () => setSource('lit');
$('#srcDiff').onclick = () => setSource('diff');

/* ---------------------------------------------------------- self-update */
/**
 * Check whether the copy on the server is newer than the copy running.
 *
 * GitHub Pages serves with a ten-minute cache and an iOS home-screen shortcut
 * can hold its copy far longer, so a new build can sit there unseen. The page
 * therefore checks itself: fetch its own URL with the cache bypassed, read the
 * build stamp out of the text, and if it differs from the one running, load the
 * fresh one. Only at start-up, before any counting has happened, so there is
 * never work to lose — and only once per launch, so a server that somehow keeps
 * answering with the old copy cannot put it in a loop.
 */
(async function checkForUpdate() {
  try {
    if (location.protocol === 'file:') return;
    if (sessionStorage.getItem('swipe.updated')) return;
    const r = await fetch(location.pathname + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const m = (await r.text()).match(/const BUILD = '([^']+)'/);
    if (!m || m[1] === BUILD) return;
    sessionStorage.setItem('swipe.updated', '1');
    const bt = document.getElementById('buildTag');
    if (bt) bt.textContent = 'updating\u2026';
    location.replace(location.pathname + '?v=' + Date.now());
  } catch (e) { /* offline, or a host that won't say. Carry on with what we have. */ }
})();
</script>
